# Deploys GitHub Pages with two versions of the portfolio:
#   main           -> https://ab-7i.github.io/abhinand-portfoilio/
#   new-portfolio  -> https://ab-7i.github.io/abhinand-portfoilio/new/
name: Deploy static content to Pages

on:
  # Redeploy when either branch changes
  push:
    branches: ["main", "new-portfolio"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (live site)
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Checkout new-portfolio (published under /new/)
        uses: actions/checkout@v4
        with:
          ref: new-portfolio
          path: site/new

      - name: Remove git metadata and workflow files from the published site
        run: rm -rf site/.git site/.github site/new/.git site/new/.github

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
